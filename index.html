<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Little Trouble for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--wine:#70283d;--rose:#d8899d;--cream:#fff8f1;--ink:#3c2430;--gold:#c9a76a}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#623047 0,transparent 28%),radial-gradient(circle at 85% 85%,#3b2739 0,transparent 30%),#1d1720;color:var(--cream);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body:before{content:'♡  ·  ✦  ·  ♡  ·  ✦  ·  ♡';position:fixed;inset:0;display:grid;place-items:center;font:clamp(70px,18vw,220px) 'Playfair Display',serif;color:#ffffff06;pointer-events:none;transform:rotate(-18deg)}
.wrap{width:min(760px,100%);margin:auto;padding:28px 18px 50px;position:relative}.topline{display:flex;justify-content:space-between;align-items:center;color:#e8c5ce;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.topline span:last-child{color:#c5a878}.progress{height:3px;background:#ffffff18;border-radius:99px;margin:18px 0 28px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#d8899d,#f3d9a5);transition:width .5s ease}
.card{background:linear-gradient(145deg,#fffaf4 0%,#f6e7df 100%);color:var(--ink);border-radius:22px;padding:clamp(24px,6vw,54px);box-shadow:0 24px 80px #0006;position:relative;overflow:hidden;min-height:440px;display:flex;flex-direction:column;justify-content:center;animation:arrive .45s ease both}.card:before{content:'';position:absolute;inset:12px;border:1px solid #b9898055;border-radius:15px;pointer-events:none}.step-tag{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:#9a5a6b;margin-bottom:18px}.emoji{font-size:40px;margin-bottom:14px;color:var(--wine);filter:drop-shadow(0 6px 9px #70283d20)}h1,h2{font-family:'Playfair Display',serif;font-weight:500;line-height:1.12;margin:0 0 18px}h1{font-size:clamp(38px,7vw,64px)}h2{font-size:clamp(30px,5vw,46px)}p{font-size:15px;line-height:1.8;color:#715765;margin:0 0 18px}.script{font:clamp(25px,4vw,33px)/1.35 'Caveat',cursive;color:var(--wine)}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}button{border:0;border-radius:999px;padding:14px 20px;font:600 13px 'DM Sans',sans-serif;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}button:hover{transform:translateY(-2px);box-shadow:0 8px 18px #70283d20}.primary{background:var(--wine);color:#fff8f1}.secondary{background:#ead7d8;color:#70283d}.tiny{font-size:11px;color:#9c7d88;margin-top:20px}.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;margin:8px 0;background:#fffdf9;border:1px solid #ead4d5;color:var(--ink);border-radius:14px;padding:15px}.choice b{font-size:20px;color:var(--rose);display:flex;align-items:center;justify-content:center}.choice span{font-size:13px;line-height:1.5}.choice:hover{background:#f8e8e8;border-color:#d8899d}.input{width:100%;padding:14px 15px;border:1px solid #dfc7c9;background:#fffdf9;border-radius:12px;font:14px 'DM Sans',sans-serif;color:var(--ink);margin:5px 0 14px;outline:none}.input:focus{border-color:var(--wine);box-shadow:0 0 0 3px #70283d12}.envelope{width:180px;height:120px;margin:4px auto 24px;position:relative;background:#d7a8a4;border-radius:8px;box-shadow:0 12px 25px #70283d20;cursor:pointer;transition:transform .25s}.envelope:hover{transform:rotate(-3deg) scale(1.03)}.envelope:before{content:'';position:absolute;inset:0;background:#e6c1b7;clip-path:polygon(0 0,50% 60%,100% 0)}.envelope:after{content:'♥';position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);color:#70283d;font-size:28px;text-shadow:0 1px #fff5}.letter{background:#f5e8cc;color:#49352d;padding:clamp(24px,5vw,42px);box-shadow:0 12px 40px #0002;border:1px solid #d8c29a;position:relative;font:20px/1.65 'Caveat',cursive;white-space:pre-wrap}.letter:before{content:'A NOTE FOR YOUR EYES ONLY';display:block;text-align:center;font:9px 'DM Sans',sans-serif;letter-spacing:.2em;color:#9a7653;margin-bottom:26px}.letter p{font:20px/1.65 'Caveat',cursive;color:#49352d;margin:0 0 12px}.letter-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.final-note{font-size:12px;color:#e5c9d0;text-align:center;margin-top:22px;line-height:1.7}.toast{min-height:20px;font-size:12px;color:#9c5d6d;margin-top:10px}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}.float{animation:float 3s ease-in-out infinite}
@media(max-width:520px){.wrap{padding:20px 12px 32px}.card{min-height:480px;border-radius:18px}.topline{font-size:9px}.buttons button{flex:1}.letter-tools button{flex:1}}
@media print{body{background:white;color:black}.wrap{width:100%;padding:0}.topline,.progress,.card,.final-note{display:none!important}#pdfLetter{display:block!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="topline"><span>✦ A tiny adventure ✦</span><span>classified: cute trouble</span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <section class="card" id="app" aria-live="polite"></section>
  <p class="final-note">Made with a little mischief, a lot of affection, and absolutely no need to rush.</p>
</main>
<script>
const icons = {
  mail: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
  heart: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>',
  sparkles: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>',
  flower: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14-2-2m-2-2-2-2m10 6 2-2m2-2 2-2M12 14v8M12 14a3 3 0 0 1-3-3V7a3 3 0 0 1 6 0v4a3 3 0 0 1-3 3Z"/></svg>',
  flame: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
  smile: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>',
  wink: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><path d="M15 9h-2"/></svg>',
  hug: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  pen: '<svg viewBox="0 0 24 24" width="1em" height="1em" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>'
};

const app=document.getElementById('app'),bar=document.getElementById('bar');
let step=0,herName='beautiful',myName='Your secret admirer',answers=[];
const total=7;
function progress(){bar.style.width=Math.min(100,(step/(total-1))*100)+'%'}
function render(){progress();
const pages=[
`<div class="step-tag">Step 01 · You've been summoned</div><div class="emoji float">${icons.mail}</div><h1>Well, hello there, trouble.</h1><p>Someone has a little something for you. But where would be the fun in simply handing it over?</p><p class="script">Your mission, should you choose to accept it: keep clicking, keep smiling, and try not to blush.</p><div class="buttons"><button class="primary" onclick="next()">I'm curious…</button><button class="secondary" onclick="tease(this)">I should be suspicious</button></div><div class="tiny" id="tease">P.S. Suspicion looks adorable on you.</div>`,
`<div class="step-tag">Step 02 · Important research</div><div class="emoji">${icons.sparkles}</div><h2>First, let's establish something.</h2><p>Which kind of attention are you secretly hoping for today?</p><button class="choice" onclick="choose('sweet')"><b>${icons.flower}</b><span><strong>Soft and sweet</strong><br>A thoughtful message and a warm hug.</span></button><button class="choice" onclick="choose('flirty')"><b>${icons.wink}</b><span><strong>Playfully flirty</strong><br>Eye contact that lasts one second too long.</span></button><button class="choice" onclick="choose('both')"><b>${icons.flame}</b><span><strong>A little of both</strong><br>Sweet words with a mischievous little grin.</span></button>`,
`<div class="step-tag">Step 03 · A tiny confession</div><div class="emoji">${icons.smile}</div><h2>Don't get too comfortable…</h2><p>Here's a very serious question. If I were standing in front of you right now, what would you do first?</p><button class="choice" onclick="choose('smile')"><b>${icons.smile}</b><span>Give you my sweetest smile.</span></button><button class="choice" onclick="choose('tease')"><b>${icons.wink}</b><span>Make you work for that smile.</span></button><button class="choice" onclick="choose('hug')"><b>${icons.hug}</b><span>Forget the talking and ask for a hug.</span></button>`,
`<div class="step-tag">Step 04 · Password required</div><div class="emoji">${icons.lock}</div><h2>To continue, you must say the magic word.</h2><p>Hint: it is what I might call you when I'm feeling especially fond of you.</p><input class="input" id="magic" placeholder="Type any cute word here…" maxlength="40"><div class="buttons"><button class="primary" onclick="magic()">Unlock the next clue</button></div><div class="toast" id="toast"></div>`,
`<div class="step-tag">Step 05 · Personalise your mischief</div><div class="emoji">${icons.pen}</div><h2>One last little detail.</h2><p>So the letter feels like it was made just for you, tell me what to call you.</p><label for="her" class="tiny">Your name or nickname</label><input class="input" id="her" placeholder="e.g. gorgeous, sweetheart, your name…" maxlength="50" value=""><label for="mine" class="tiny">And who is being this charming?</label><input class="input" id="mine" placeholder="Your name / nickname" maxlength="50"><div class="buttons"><button class="primary" onclick="names()">Seal the deal</button></div>`,
`<div class="step-tag">Step 06 · Almost there</div><div class="emoji">${icons.heart}</div><h2>You're dangerously close.</h2><p>You've followed the clues, entertained my nonsense, and made it this far. That deserves a reward.</p><p class="script">Take a breath. Put on your most innocent face. Then tap the envelope.</p><div class="envelope" role="button" tabindex="0" aria-label="Open envelope" onclick="next()" onkeydown="if(event.key==='Enter')next()"></div><p style="text-align:center;font-size:12px">Psst… the letter is inside.</p>`,
`<div class="step-tag">Step 07 · The thing you came for</div><div class="emoji">${icons.mail}</div><h2>Found you, sweetheart.</h2><p>Here it is. A little note, just for you. Read it slowly… and maybe think of me for a second.</p><div class="letter" id="pdfLetter"></div><div class="tiny" style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:20px;">You found the letter. I hope you know you're worth the extra clicks. ${icons.heart}</div>`
];
app.innerHTML=pages[step];if(step===4){document.getElementById('her').value=herName==='beautiful'?'':herName;document.getElementById('mine').value=myName==='Your secret admirer'?'':myName;}if(step===6)makeLetter();
}
function next(){if(step<6){step++;render()}}
function tease(el){el.textContent='You are suspiciously cute when you pretend not to be curious. Try again.';el.textContent+=' ';}
function choose(value){answers.push(value);step++;render()}
function magic(){const val=document.getElementById('magic').value.trim();if(!val){document.getElementById('toast').textContent='No password? Just type a word that makes you smile.';return}answers.push(val);next()}
function names(){herName=document.getElementById('her').value.trim()||'beautiful';myName=document.getElementById('mine').value.trim()||'Your secret admirer';next()}
function makeLetter(){const content=`${herName},\n\nOhandi ku popifa nombili nombili ya weelela. Ame ondi li nawa kolutu noko mwenyo, ndele ondi na eelinekelo kutya naave opo u li nawa, paushili u li mombili yOmwene.\n\nOshitukulwa shombapila yange osho: Onda hala oku ku kundanifa kombinga yomutima wange. Okudja efiku olo ndeku mona, omutima wange owa fuda po oshitunda shimwe ndele ou li ashike kuove. Ohandi uya kuove netumbulo lomutima wange kutya: "Ondi ku hole."\n\nPaushili, ihandi kofa naawa ngele handi diladila ouwa woye nepopilo loye liwa. Epulo lange ololo kutya: Mbela omutima woye owa manguluka ngoo opo u tambule nge, tu tameke ondjila yetu filu oule wefimbo letu?\n\nInashi pumbwa u nyamukule unene paife, teelela eemwedi di pite ndele to diladila nawa to nyamukula nge. Ohandi tumu ombapila ei pamwe no website  opo yifike meke loye mwene.\n\nAme omumati woye te eku linekela naye filu,\n${myName}\n\nP.S. Welcome to the 90s 😂😂`;
const el=document.getElementById('pdfLetter');el.textContent=content;}
render();
</script>
</body>
</html>
